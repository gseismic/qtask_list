      - generic [ref=f1e5483]:
        - heading "关键数字怎么读" [level=2] [ref=f1e5484]
        - paragraph [ref=f1e5485]: attempt：第几次尝试。max_retry=3 表示总共 3 次机会。待处理：ready+processing+旧 retry+delay，其中 retry_wait 已包含在 delay 内。色条表示当前待处理任务的状态构成。观测完成：本次访问最近约 1 小时内观察到的完成增量，切换页面会保留，完整刷新浏览器后重新采样。速率：至少观测 30 秒后估算每分钟完成条数。ETA：仅在无延迟任务且有速率样本时粗估。疑似停滞：持续有 ready 积压和在线 Worker，连续 2 分钟没有完成；空闲、无 Worker 或观测中断会重新计时。完成/失败等标签的计数为累计值，历史保留期可能使可查记录更少。
      - generic [ref=f1e5486]:
        - heading "去重：同一件事只干一次" [level=2] [ref=f1e5487]
        - paragraph [ref=f1e5488]: logical_key 是"这件事的身份"。同一个身份的任务在途（未到终态）时不会被重复投递，天然防重。带时间桶的 key（如 quote:AAPL:20260921T1000）让每个时间片天然是"新的一件事"。
      - generic [ref=f1e5489]:
        - heading "Worker 与心跳" [level=2] [ref=f1e5490]
        - paragraph [ref=f1e5491]: Worker 定期写心跳，相当于"报平安"。心跳消失（进程崩溃/机器宕机）后，它 processing 里的任务变成孤儿，可以在 Worker 页或队列页一键恢复回主队列。崩溃不会丢任务，但可能重跑——所以业务落库一定要幂等。
