      - generic [ref=f1e5439]:
        - heading "任务和队列的关系" [level=2] [ref=f1e5440]
        - paragraph [ref=f1e5441]: 队列 = 流水线的名字（一类活），任务 = 流水线里一件具体的活。namespace 是项目分组前缀（冒号前面），比如 stockev:quote:5min 就是 stockev 项目下的行情 5 分钟抓取流水线。对应到后台：队列页看流水线整体，任务表格看每件事的具体进展。
        - generic [ref=f1e5442]:
          - code [ref=f1e5443]: stockev:quote:5min
          - text: 是一个队列；"抓取 2026-09-21 10:00 这根 AAPL 行情"就是里面的一条任务， 用 logical_key
          - code [ref=f1e5444]: quote:AAPL:20260921T1000
          - text: 标记身份。
