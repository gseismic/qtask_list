      - generic [ref=f6e65]:
        - heading "任务和队列的关系" [level=2] [ref=f6e66]
        - paragraph [ref=f6e67]: 队列 = 流水线的名字（一类活），任务 = 流水线里一件具体的活。namespace 是项目分组前缀（冒号前面），比如 stockev:quote:5min 就是 stockev 项目下的行情 5 分钟抓取流水线。对应到后台：队列页看流水线整体，任务表格看每件事的具体进展。
